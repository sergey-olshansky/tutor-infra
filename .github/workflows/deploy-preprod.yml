name: Deploy to Preprod
run-name: "preprod-${{ inputs.request_id }}-${{ inputs.image_tag }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Unique dispatch correlation ID"
        required: false
        type: string
      image_tag:
        description: "Временный тег task-<N>-lms-<sha12>-infra-<sha12>-run-<id>-<attempt> из Build"
        required: true
        type: string
      task_id:
        description: "Номер задачи Vikunja, занимающей preprod"
        required: true
        type: string
      force:
        description: "Принудительно сменить занимающую задачу (только владельцу!)"
        required: false
        default: false
        type: boolean
      clone_prod:
        description: "Restore latest production data (default: yes)"
        required: false
        default: true
        type: boolean

concurrency:
  group: preprod-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.PREPROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.PREPROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Check preprod occupancy (one task at a time)
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          CURRENT=$(ssh root@${{ secrets.PREPROD_HOST }} 'cat /srv/tutor/frappe_docker/.preprod-task 2>/dev/null | head -1' || echo "")
          echo "Preprod занят: '${CURRENT:-<свободен>}'; выкладываем задачу: '${TASK_ID}'"
          if [[ -n "$CURRENT" && "$CURRENT" != "$TASK_ID" && "$FORCE" != "true" ]]; then
            echo "::error::Preprod занят задачей ${CURRENT}. Вторая задача не заменяет первую: закройте текущую (или запустите с force, если вы владелец и понимаете последствия)." >&2
            exit 1
          fi

      - name: Transfer image if missing (single-image rotation)
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMG="ghcr.io/sergey-olshansky/tutor-learning:${IMAGE_TAG}"
          PRESENT=$(ssh root@${{ secrets.PREPROD_HOST }} "docker image inspect '$IMG' >/dev/null 2>&1 && echo yes || echo no")
          echo "Образ на preprod: $PRESENT"
          if [[ "$PRESENT" == "yes" ]]; then
            echo "Передача не нужна (тег уже на сервере)."
            exit 0
          fi
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "$IMG"
          echo "Останавливаем сервисы и освобождаем место под один новый образ:"
          ssh root@${{ secrets.PREPROD_HOST }} bash -s <<'REMOTE'
          set -Eeuo pipefail
          cd /srv/tutor/frappe_docker
          docker compose -f compose.yaml -f overrides/compose.mariadb.yaml -f overrides/compose.redis.yaml -f overrides/compose.noproxy.yaml -p tutor stop backend websocket frontend scheduler queue-short queue-long
          docker image rm -f $(docker images -q ghcr.io/sergey-olshansky/tutor-learning) 2>/dev/null || true
          docker system prune -af --volumes=false >/dev/null 2>&1 || true
          rm -rf /tmp/prod-backup-* /var/tmp/* 2>/dev/null || true
          apt-get clean 2>/dev/null || true
          echo "Место после чистки:"; df -h / | tail -1
          REMOTE
          docker save "$IMG" | gzip | ssh root@${{ secrets.PREPROD_HOST }} 'gunzip | docker load'

      - name: Switch preprod to the image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          ssh root@${{ secrets.PREPROD_HOST }} bash -s -- "$IMAGE_TAG" "$TASK_ID" <<'REMOTE'
          set -Eeuo pipefail
          IMAGE_TAG="$1"; TASK_ID="$2"
          cd /srv/tutor/frappe_docker
          sed -i "s/^CUSTOM_TAG=.*/CUSTOM_TAG=${IMAGE_TAG}/" .env
          printf '%s\n%s\n%s\n' "$TASK_ID" "$IMAGE_TAG" "$(date -u +%FT%TZ)" > .preprod-task
          DC() { docker compose -f compose.yaml -f overrides/compose.mariadb.yaml -f overrides/compose.redis.yaml -f overrides/compose.noproxy.yaml -p tutor "$@"; }
          DC up -d --pull never backend websocket frontend scheduler queue-short queue-long 2>&1 | tail -5
          sleep 25
          DC exec -T backend bash -c "cd /home/frappe/frappe-bench && bench --site ${{ secrets.PREPROD_SITE }} migrate" | tail -3 || true
          DC exec -T backend bash -c "cd /home/frappe/frappe-bench && bench --site ${{ secrets.PREPROD_SITE }} clear-cache" 2>&1 | tail -1
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H "Host: ${{ secrets.PREPROD_SITE }}" http://127.0.0.1:8080/api/method/ping || true)
            [[ "$code" == "200" ]] && break
            sleep 5
          done
          [[ "$code" == "200" ]] || { echo "::error::Сайт не поднялся (код $code)"; exit 1; }
          docker system prune -f >/dev/null 2>&1 || true
          echo "PREPROD OK"
          REMOTE

      - name: Clone production data (optional)
        id: clone
        if: ${{ inputs.clone_prod }}
        env:
          CONTROL_HOST: 135.106.196.249
          CONTROL_HOST_FINGERPRINT: SHA256:H/PR8KAwhJ/VHNV/DiB4i8SBNI3spMLr4/I5nuZpkD8
        run: |
          set -Eeuo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/control_key"
          echo "${{ secrets.CONTROL_SSH_KEY }}" > "$RUNNER_TEMP/control_key"
          ssh-keyscan -t ed25519 "$CONTROL_HOST" > "$RUNNER_TEMP/control_known_hosts" 2>/dev/null
          ACTUAL=$(ssh-keygen -lf "$RUNNER_TEMP/control_known_hosts" -E sha256 | awk 'NR==1{print $2}')
          [ "$ACTUAL" = "$CONTROL_HOST_FINGERPRINT" ] || { echo "::error::Не совпал host key control"; exit 1; }

          SSH_CONTROL=(ssh -i "$RUNNER_TEMP/control_key" -o BatchMode=yes -o UserKnownHostsFile="$RUNNER_TEMP/control_known_hosts")
          SCP_CONTROL=(scp -i "$RUNNER_TEMP/control_key" -o BatchMode=yes -o UserKnownHostsFile="$RUNNER_TEMP/control_known_hosts")

          echo "Fetching backup from control..."
          BACKUP_FILE=$("${SSH_CONTROL[@]}" root@"$CONTROL_HOST" 'ls -t /var/backups/production/lms-backup-*.tgz | head -1')
          echo "Found: $(basename "$BACKUP_FILE")"
          "${SCP_CONTROL[@]}" "root@$CONTROL_HOST:$BACKUP_FILE" /tmp/prod-backup.tgz
          scp -o BatchMode=yes /tmp/prod-backup.tgz root@${{ secrets.PREPROD_HOST }}:/tmp/
          rm /tmp/prod-backup.tgz
          echo "Restoring on preprod..."

          # Restore-скрипт исполняется из ФАЙЛА на preprod, а не через stdin bash -s:
          # ранее `docker exec -i ... mariadb -e "..."` без своего stdin съедал
          # остаток heredoc, bash -s на EOF выходил с кодом 0 → молчаливый false success.
          cat > "$RUNNER_TEMP/restore-prod.sh" <<'RESTORE'
          set -Eeuo pipefail
          SITE="$1"
          cd /srv/tutor/frappe_docker
          DC() { docker compose -f compose.yaml -f overrides/compose.mariadb.yaml -f overrides/compose.redis.yaml -f overrides/compose.noproxy.yaml -p tutor "$@"; }
          DBPASS=$(grep ^DB_PASSWORD= .env | cut -d= -f2)
          CID=$(docker ps -aq -f name=tutor-db-1)
          SITES=$(docker volume inspect tutor_sites --format '{{.Mountpoint}}')
          SITE_DIR="$SITES/$SITE"
          [ -d "$SITE_DIR" ] || { echo "Site dir not found: $SITE_DIR"; exit 1; }
          echo "== Stop services"
          DC stop backend websocket frontend scheduler queue-short queue-long 2>/dev/null || true
          echo "== Extract backup"
          rm -rf /tmp/restore && mkdir -p /tmp/restore
          tar xf /tmp/prod-backup.tgz -C /tmp/restore
          DBFILE=$(ls /tmp/restore/*database*.sql.gz | head -1)
          echo "== Restore database"
          docker exec -i "$CID" mariadb -uroot -p"$DBPASS" -e "DROP DATABASE IF EXISTS _prodclone; CREATE DATABASE _prodclone;" < /dev/null
          zcat "$DBFILE" | sed -e '/^CREATE DATABASE/d' -e '/^USE /d' | docker exec -i "$CID" mariadb -uroot -p"$DBPASS" _prodclone
          TABLES=$(docker exec "$CID" mariadb -uroot -p"$DBPASS" -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='_prodclone';" 2>/dev/null || echo 0)
          echo "   restored tables: $TABLES"
          [ "$TABLES" -gt 50 ] || { echo "FAILED: only $TABLES tables restored"; exit 1; }
          DBPASS_SITE=$(jq -r .db_password "$SITE_DIR/site_config.json" 2>/dev/null || echo "$DBPASS")
          docker exec "$CID" mariadb -uroot -p"$DBPASS" -e "
            DROP USER IF EXISTS '_prodclone'@'%';
            CREATE USER '_prodclone'@'%' IDENTIFIED BY '$DBPASS_SITE';
            GRANT ALL ON _prodclone.* TO '_prodclone'@'%';
            FLUSH PRIVILEGES;" 2>/dev/null || echo "   DB user creation skipped"
          jq --arg db _prodclone '.db_name = $db' "$SITE_DIR/site_config.json" > "$SITE_DIR/site_config.json.tmp"
          mv "$SITE_DIR/site_config.json.tmp" "$SITE_DIR/site_config.json"
          chown 1000:1000 "$SITE_DIR/site_config.json"
          echo "== Restore files"
          mkdir -p /tmp/restore/files-private /tmp/restore/files-public
          for F in /tmp/restore/*private-files*.tar; do
            [ -f "$F" ] && tar xf "$F" -C /tmp/restore/files-private 2>/dev/null
          done
          for F in /tmp/restore/*files.tar; do
            [ -f "$F" ] && tar xf "$F" -C /tmp/restore/files-public 2>/dev/null
          done
          mkdir -p "$SITE_DIR/private/files" "$SITE_DIR/public/files"
          cp -a /tmp/restore/files-private/sites/*/private/files/. "$SITE_DIR/private/files/" 2>/dev/null || true
          cp -a /tmp/restore/files-public/sites/*/public/files/. "$SITE_DIR/public/files/" 2>/dev/null || true
          chown -R 1000:1000 "$SITE_DIR/private/files" "$SITE_DIR/public/files"
          echo "== Restart"
          rm -rf /tmp/restore /tmp/prod-backup.tgz
          DC up -d --pull never backend websocket frontend scheduler queue-short queue-long 2>&1 | tail -3
          sleep 40
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H "Host: $SITE" http://127.0.0.1:8080/api/method/ping || true)
            [[ "$code" == "200" ]] && break
            sleep 5
          done
          [[ "$code" == "200" ]] && echo "CLONE_OK" || { echo "FAILED after restore"; exit 1; }
          RESTORE

          scp -o BatchMode=yes "$RUNNER_TEMP/restore-prod.sh" root@${{ secrets.PREPROD_HOST }}:/tmp/restore-prod.sh
          cleanup() { ssh -n root@${{ secrets.PREPROD_HOST }} 'rm -f /tmp/restore-prod.sh /tmp/prod-backup.tgz' || true; }
          trap cleanup EXIT
          # -n: ssh не читает stdin раннера; ненулевой exit скрипта валит шаг (pipefail)
          ssh -n root@${{ secrets.PREPROD_HOST }} bash /tmp/restore-prod.sh "${{ secrets.PREPROD_SITE }}" 2>&1 | tee "$RUNNER_TEMP/restore.log"
          grep -qx 'CLONE_OK' "$RUNNER_TEMP/restore.log" \
            && echo "clone_status=CLONE_OK" >> "$GITHUB_OUTPUT" \
            || { echo "::error::CLONE_OK не подтверждён — прод-данные НЕ склонированы" >&2; echo "clone_status=NOT_CONFIRMED" >> "$GITHUB_OUTPUT"; exit 1; }
      - name: Result
        env:
          CLONE_STATUS: ${{ steps.clone.outputs.clone_status }}
        run: |
          echo "Task #${{ inputs.task_id }} deployed to preprod:"
          echo "URL:   http://${{ secrets.PREPROD_HOST }}:8080"
          echo "Image: ghcr.io/sergey-olshansky/tutor-learning:${{ inputs.image_tag }}"
          if [[ "$CLONE_STATUS" == "CLONE_OK" ]]; then
            echo "Clone: production data restored (CLONE_OK подтверждён)"
          elif [[ -n "$CLONE_STATUS" ]]; then
            echo "Clone: clone NOT confirmed ($CLONE_STATUS)"
          else
            echo "Clone: clean (clone_prod=false)"
          fi
