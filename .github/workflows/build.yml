name: Build Tutor Learning
run-name: "build-${{ inputs.request_id }}-${{ inputs.lms_sha }}"

on:
  workflow_dispatch:
    inputs:
      inspect_digest:
        description: "Read-only verification of an existing image digest; skips all build/push steps"
        required: false
        type: string
      request_id:
        description: "Unique dispatch correlation ID"
        required: false
        type: string
      lms_sha:
        description: "Exact LMS commit to build (40 lowercase hex)"
        required: false
        type: string
      lms_branch:
        description: "Ветка LMS для сборки (по умолчанию tutor-main). Tip ветки фиксируется в теге образа."
        required: false
        type: string
      image_tag:
        description: "Optional additional alias (the branch/run-specific tag is always published)"
        required: false
        type: string
      frappe_branch:
        description: "Frappé branch (develop matches frappe-ui rc.1)"
        required: false
        default: "develop"
        type: string
  push:
    branches:
      - main
    paths:
      - "apps.json"
      - "Containerfile"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

jobs:
  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.inspect_digest != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate immutable inspection inputs
        env:
          IMAGE_DIGEST: ${{ inputs.inspect_digest }}
          LMS_SHA: ${{ inputs.lms_sha }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$LMS_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sergey-olshansky/lms
          ref: ${{ inputs.lms_sha }}
          path: inspection-source
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published image bytes and asset paths
        env:
          IMAGE_DIGEST: ${{ inputs.inspect_digest }}
          LMS_SHA: ${{ inputs.lms_sha }}
        run: |
          python3 scripts/verify-image-assets.py --digest "$IMAGE_DIGEST" --sha "$LMS_SHA" \
            --source inspection-source --output image-verification/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-verification-${{ inputs.lms_sha }}
          path: image-verification/report.json
          if-no-files-found: error
  build:
    if: ${{ inputs.inspect_digest == '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra
        uses: actions/checkout@v4

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Resolve LMS branch to an exact commit
        shell: bash
        env:
          REQUESTED_BRANCH: ${{ inputs.lms_branch }}
          REQUESTED_SHA: ${{ inputs.lms_sha }}
        run: |
          set -euo pipefail
          BRANCH="${REQUESTED_BRANCH:-tutor-main}"
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid branch name: $BRANCH" >&2
            exit 1
          fi
          LMS_SHA="${REQUESTED_SHA:-$(git ls-remote https://github.com/sergey-olshansky/lms "refs/heads/$BRANCH" | awk '{print $1}')}"
          if [[ ! "$LMS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve branch $BRANCH" >&2
            exit 1
          fi
          echo "LMS_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "LMS_SHA=$LMS_SHA" >> "$GITHUB_ENV"
          # Materialize the exact commit into the Docker context. bench init clones
          # this local repository, so a moving remote branch cannot change bytes.
          mkdir -p frappe_docker/pinned-lms
          curl --fail --location --silent --show-error \
            "https://api.github.com/repos/sergey-olshansky/lms/tarball/$LMS_SHA" \
            | tar -xz --strip-components=1 -C frappe_docker/pinned-lms
          git -C frappe_docker/pinned-lms init -q
          git -C frappe_docker/pinned-lms config user.name build-pin
          git -C frappe_docker/pinned-lms config user.email build-pin@users.noreply.github.com
          git -C frappe_docker/pinned-lms add -A
          git -C frappe_docker/pinned-lms commit -qm "Snapshot LMS $LMS_SHA"
          git -C frappe_docker/pinned-lms branch -M pinned
          jq --arg url "file:///opt/frappe/pinned-lms" \
            '.[1] = {url: $url, branch: "pinned"}' apps.json > apps.build.json
          mv apps.build.json apps.json

      - name: Set image variables
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          BRANCH_SLUG=$(printf '%s' "$LMS_BRANCH" | tr '[:upper:]/' '[:lower:]-' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[^a-z0-9]+//; s/[^a-z0-9]+$//' | cut -c1-40)
          [[ -n "$BRANCH_SLUG" ]] || { echo "Invalid branch slug" >&2; exit 1; }
          # Task images and production candidates have separate, non-overlapping formats.
          if [[ "$LMS_BRANCH" == tutor-main ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "Production images require infra main" >&2; exit 1; }
            IMMUTABLE_TAG="lms-${LMS_SHA:0:8}-infra-${GITHUB_SHA:0:8}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          elif [[ "$LMS_BRANCH" =~ ^task/([0-9]+)$ ]]; then
            IMMUTABLE_TAG="task-${BASH_REMATCH[1]}-lms-${LMS_SHA:0:12}-infra-${GITHUB_SHA:0:12}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            echo "Only tutor-main or task/<number> can be built" >&2
            exit 1
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tutor-learning"
          TAGS="${IMAGE}:${IMMUTABLE_TAG}"
          if [[ -n "$REQUESTED_TAG" ]]; then
            echo "Additional aliases are not allowed for release images" >&2
            exit 1
          fi
          # Only an accepted change merged to main may refresh the production-facing alias.
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            TAGS+=$'\n'"${IMAGE}:main"
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "TAG=$IMMUTABLE_TAG" >> "$GITHUB_ENV"
          {
            echo 'TAGS<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./Containerfile
          platforms: linux/amd64
          push: true

          tags: ${{ env.TAGS }}

          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ inputs.frappe_branch || 'develop' }}
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}-${{ env.LMS_SHA }}

          secret-files: |
            apps_json=./apps.json

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify requested commit remains branch tip
        shell: bash
        run: |
          set -euo pipefail
          AFTER=$(git ls-remote https://github.com/sergey-olshansky/lms "refs/heads/$LMS_BRANCH" | awk '{print $1}')
          if [[ "$AFTER" != "$LMS_SHA" ]]; then
            echo "::error::Branch $LMS_BRANCH moved during the build ($LMS_SHA -> $AFTER). The image tag no longer reflects its contents; rebuild required." >&2
            exit 1
          fi

      - name: Verify published image bytes and asset paths
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 scripts/verify-image-assets.py --digest "$IMAGE_DIGEST" --sha "$LMS_SHA" \
            --source frappe_docker/pinned-lms --output image-verification/report.json

      - uses: actions/upload-artifact@v4
        with:
          name: image-verification-${{ env.LMS_SHA }}
          path: image-verification/report.json
          if-no-files-found: error

      - name: Show result
        run: |
          echo "Built:"
          echo "${IMAGE}:${TAG}"
          echo "LMS branch: ${LMS_BRANCH}"
          echo "LMS commit: ${LMS_SHA}"
