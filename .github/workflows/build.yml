name: Build Tutor Learning

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag (defaults to lms-<LMS commit SHA>)"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "apps.json"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra
        uses: actions/checkout@v4

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Set image variables
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          LMS_SHA=$(git ls-remote https://github.com/sergey-olshansky/lms refs/heads/tutor-main | awk '{print $1}')
          if [[ ! "$LMS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve tutor-main LMS commit" >&2
            exit 1
          fi

          TAG=${REQUESTED_TAG:-lms-${LMS_SHA:0:8}}
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag: $TAG" >&2
            exit 1
          fi

          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tutor-learning" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "LMS_SHA=$LMS_SHA" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          platforms: linux/amd64
          push: true

          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:main

          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}-${{ env.LMS_SHA }}

          secret-files: |
            apps_json=./apps.json

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show result
        run: |
          echo "Built:"
          echo "${IMAGE}:${TAG}"
          echo "${IMAGE}:main"
          echo "LMS commit: ${LMS_SHA}"
