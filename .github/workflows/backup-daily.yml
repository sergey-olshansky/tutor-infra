name: Daily Production Backup
run-name: "backup-${{ github.event_name }}-${{ github.run_id }}"

on:
  schedule:
    # 00:00 UTC = 03:00 МСК (MSK = UTC+3 круглый год). В пиковые минуты GitHub
    # может задержать запуск на несколько минут — это нормально.
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: production-backup-daily
  cancel-in-progress: false

permissions:
  contents: write  # журнал releases/backups.log

jobs:
  backup:
    name: Backup to S3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH to production
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.PROD_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Run production backup (bench -> control)
        id: backup
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
          S3_RETAIN_DAYS: ${{ vars.S3_RETAIN_DAYS }}
        run: |
          set -euo pipefail
          PROD=root@${{ secrets.PROD_HOST }}
          # Для ежедневного бекапа S3 — цель хранения; без него запуск бессмыслен.
          [[ -n "$S3_BUCKET" ]] || { echo "::error::S3 не настроен (vars.S3_BUCKET пуст). Настройка: BACKUP.md."; exit 1; }
          # Загрузка в S3 выполняется НА проде (RU->RU): канал раннер->Selectel
          # не тянет 400 МБ (run 41870610250). Секреты — во временный env-файл
          # на tmpfs /run, только через stdin.
          printf 'S3_ACCESS_KEY_ID=%s\nS3_SECRET_ACCESS_KEY=%s\nS3_BUCKET=%s\nS3_ENDPOINT_URL=%s\nS3_REGION=%s\nS3_PREFIX=%s\nS3_RETAIN_DAYS=%s\n' \
            "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" \
            "$S3_BUCKET" "$S3_ENDPOINT_URL" "$S3_REGION" "$S3_PREFIX" "$S3_RETAIN_DAYS" \
            | ssh -o BatchMode=yes "$PROD" 'umask 077 && cat > /run/tutor-s3.env'
          OUT=$(ssh -o BatchMode=yes "$PROD" bash -s -- \
            "${{ secrets.CONTROL_HOST }}" daily < scripts/backup-production.sh)
          printf '%s\n' "$OUT"
          FILE=$(printf '%s\n' "$OUT" | sed -n 's/^BACKUP_FILE=//p')
          SHA=$(printf '%s\n' "$OUT" | sed -n 's/^BACKUP_SHA256=//p')
          SIZE=$(printf '%s\n' "$OUT" | sed -n 's/^BACKUP_SIZE=//p')
          [[ -n "$FILE" && -n "$SHA" && -n "$SIZE" ]] || { echo "::error::Нет маркеров BACKUP_* в выводе"; exit 1; }
          # Имя фиксируем в outputs сразу: cleanup-шаг обязан сработать при любом сбое ниже.
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload to S3 (from production)
        id: s3upload
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes root@${{ secrets.PROD_HOST }} \
            'set -a; . /run/tutor-s3.env; set +a; bash -s -- upload /tmp/${{ steps.backup.outputs.file }}' \
            < scripts/s3-backup.sh

      - name: Cleanup staging on production
        if: ${{ always() && steps.backup.outputs.file != '' }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes root@${{ secrets.PROD_HOST }} \
            "rm -f /run/tutor-s3.env /tmp/${{ steps.backup.outputs.file }}"

      - name: Journal (releases/backups.log)
        # Best-effort: бекап уже защищён (control+S3); журнал не должен ронять ран.
        # Ежедневный коммит также не даёт GitHub выключить расписание после
        # 60 дней тишины в репозитории.
        if: ${{ !cancelled() && steps.backup.outputs.file != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          STATUS="s3=ok"
          if [[ "${{ steps.s3upload.outcome }}" != "success" ]]; then STATUS="s3=FAILED(control-only)"; fi
          LINE="$(date -u +%FT%TZ) | daily | ${{ steps.backup.outputs.file }} | ${{ steps.backup.outputs.size }} bytes | sha256 ${{ steps.backup.outputs.sha }} | $STATUS | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          mkdir -p repo && cd repo
          git clone -q --depth 5 "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" .
          git config user.name "backup-bot" && git config user.email "backup-bot@users.noreply.github.com"
          mkdir -p releases
          echo "$LINE" >> releases/backups.log
          git add releases/backups.log
          if git commit -qm "backup: daily ${{ steps.backup.outputs.file }}"; then
            git pull -q --rebase origin main || true
            git push -q origin main && echo "Записано в журнал: $LINE" || echo "::warning::Не удалось записать журнал (не критично)"
          else
            echo "Журнал не изменён (нет отличий)"
          fi
